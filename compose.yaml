name: gaido

services:
  database:
    image: postgres:18.4-alpine3.23
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gaido}
      POSTGRES_USER: ${POSTGRES_USER:-gaido}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gaido}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    build:
      context: ./apps/api
    init: true
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-gaido}:${POSTGRES_PASSWORD:-gaido}@database:5432/${POSTGRES_DB:-gaido}
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./apps/api:/app
      - api_venv:/app/.venv
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready')",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  web:
    build:
      context: ./apps/web
    init: true
    environment:
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${WEB_PORT:-5174}:5173"
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5173').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
  api_venv:
  web_node_modules:
