[project]
name = "gaido-api"
version = "0.1.0"
description = "API de Gaido"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic==1.18.5",
    "fastapi[standard]==0.138.2",
    "psycopg[binary]==3.3.4",
    "pydantic-settings==2.14.2",
    "sqlalchemy==2.0.51",
]

[dependency-groups]
dev = [
    "httpx2==2.9.1",
    "pytest==9.1.1",
    "ruff==0.16.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
